name: Figma to ClickUp sync

# Dispara a function functions/figma-webhook.js via HTTP, de 45 em 45 minutos,
# só em dias úteis e horário comercial (08:30–18:15, América/São_Paulo,
# UTC-3), mesmo padrão do clickup-sync-schedule.yml. Não é um webhook em
# tempo real do Figma — uma chamada só do Worker não aguenta percorrer todos
# os itens de um cliente sem estourar o limite de subrequests (50 no plano
# free do Cloudflare), então isso roda em duas etapas por cliente:
#   1. list_items: true → lista os itens (frames de topo) do cliente.
#   2. item_node_id: "<id>" → sincroniza um item por vez.
# Ver docs/FIGMA_SYNC_SETUP.md pra detalhes e como adicionar um cliente novo.

on:
  schedule:
    - cron: '30 11,14,17,20 * * 1-5'
    - cron: '15 12,15,18,21 * * 1-5'
    - cron: '0 13,16,19 * * 1-5'
    - cron: '45 13,16,19 * * 1-5'
  workflow_dispatch: {}

# Garante que só uma sincronização rode por vez — mesmo motivo do
# clickup-sync-schedule.yml (evita duas execuções batendo na API do Figma/
# ClickUp ao mesmo tempo se um disparo manual coincidir com o cron).
concurrency:
  group: figma-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync each Figma client, one item per call
        env:
          FIGMA_SYNC_PASSCODE: ${{ secrets.FIGMA_WEBHOOK_PASSCODE }}
        run: |
          # Precisa bater com os "name" cadastrados em FIGMA_CLIENTS no
          # functions/figma-webhook.js — atualize os dois juntos ao
          # adicionar um cliente novo.
          CLIENTS=(
            "PROTS"
          )
          FAILED=0
          for CLIENT in "${CLIENTS[@]}"; do
            echo "=== $CLIENT: listando itens ==="
            LIST_BODY=$(printf '{"passcode":"%s","client":"%s","list_items":true}' "$FIGMA_SYNC_PASSCODE" "$CLIENT")
            ITEMS_JSON=$(curl -sS -X POST \
              https://clientes.vanzaklabs.com/figma-webhook \
              -H 'Content-Type: application/json' \
              -d "$LIST_BODY")
            echo "$ITEMS_JSON"

            while read -r ITEM; do
              [ -z "$ITEM" ] && continue
              ITEM_ID=$(echo "$ITEM" | jq -r '.id')
              ITEM_NAME=$(echo "$ITEM" | jq -r '.name')
              BODY=$(printf '{"passcode":"%s","client":"%s","item_node_id":"%s"}' "$FIGMA_SYNC_PASSCODE" "$CLIENT" "$ITEM_ID")
              HTTP_STATUS=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
                https://clientes.vanzaklabs.com/figma-webhook \
                -H 'Content-Type: application/json' \
                -d "$BODY")
              echo "--- $CLIENT / $ITEM_NAME ($ITEM_ID): HTTP $HTTP_STATUS ---"
              cat response.txt
              echo
              if [ "$HTTP_STATUS" -ge 400 ]; then
                FAILED=1
              fi
              # Espaça as chamadas pra não estourar o rate limit da API do
              # ClickUp/Figma (mesmo motivo do clickup-sync-schedule.yml).
              sleep 5
            done < <(echo "$ITEMS_JSON" | jq -c '.[]')
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more Figma item syncs failed"
            exit 1
          fi
