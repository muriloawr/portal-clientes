name: Figma to ClickUp sync

# Roda scripts/figma-sync.js direto no runner do GitHub Actions, uma vez por
# dia à meia-noite (América/São Paulo, UTC-3) — funciona como uma auditoria
# diária, não precisa ser tão frequente quanto a sync do cronograma: o Figma
# normalmente só muda quando alguém termina uma sessão de design, não a cada
# 45 min. Essa sync só lê o Figma e cria/atualiza tasks no ClickUp — não mexe
# no site do cliente — então não tem motivo pra depender do Cloudflare (isso
# ficou só pra sync que atualiza o cronograma, que precisa commitar/publicar
# HTML). Rodando aqui, sem limite de subrequests do Worker, sincroniza tudo
# numa execução só, sem chunking artificial.
# Ver docs/FIGMA_SYNC_SETUP.md pra detalhes e como adicionar um cliente novo.

on:
  schedule:
    - cron: '0 3 * * *' # 00:00 America/Sao_Paulo (UTC-3), todo dia
  workflow_dispatch: {}

concurrency:
  group: figma-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync Figma -> ClickUp
        env:
          FIGMA_API_TOKEN: ${{ secrets.FIGMA_API_TOKEN }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: node scripts/figma-sync.js
