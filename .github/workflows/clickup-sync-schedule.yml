name: ClickUp scheduled sync

# Dispara a mesma function de sync (functions/clickup-webhook.js) via HTTP, de 45 em
# 45 minutos, só em dias úteis e horário comercial (08:30–18:15, América/São_Paulo,
# UTC-3 sem horário de verão). Os horários abaixo já estão convertidos pra UTC, que é
# o fuso que o GitHub Actions usa pra cron. Substitui o webhook em tempo real do
# ClickUp — não depende de eventos, só roda nesses horários fixos.

on:
  schedule:
    - cron: '30 11,14,17,20 * * 1-5'
    - cron: '15 12,15,18,21 * * 1-5'
    - cron: '0 13,16,19 * * 1-5'
    - cron: '45 13,16,19 * * 1-5'
  workflow_dispatch: {}

# Garante que só uma sincronização rode por vez. Sem isso, um disparo manual
# (workflow_dispatch) que coincida com o horário de um cron agendado faz duas
# execuções baterem na API do ClickUp ao mesmo tempo, cada uma do zero — o que
# estoura o rate limit mesmo com o "sleep" entre chamadas dentro de uma única
# execução. A segunda execução fica na fila e roda assim que a primeira acabar.
concurrency:
  group: clickup-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync (one HTTP call per client)
        env:
          SYNC_SECRET: ${{ secrets.CLICKUP_WEBHOOK_SECRET }}
        run: |
          # Precisa bater com os "name" cadastrados em CLIENTS no
          # functions/clickup-webhook.js — atualize os dois juntos ao adicionar
          # um cliente novo. Uma chamada HTTP por cliente porque cada invocação
          # do Worker tem limite de subrequests (50 no plano free do
          # Cloudflare); processar todos numa chamada só estoura esse limite.
          CLIENTS=(
            "Humara"
            "Uplift Fitness"
            "InfinitAge"
            "A Confiteria"
            "Orgânico Natural"
            "Adah Beauty Tech"
            "Sellévia"
            "Booma Organic"
            "Beleza Brasileira"
            "Yasmin Beauty"
            "Beeva"
            "PROTS"
            "TAG Grading Brazil"
            "Cookie Dreams"
            "MUUPI"
            "Mye Mye"
            "Piny"
            "AIB Beauty"
            "Bako Cosmetics"
            "Kunha P"
            "SenseBe"
            "Bash Beauty"
          )
          FAILED=0
          for CLIENT in "${CLIENTS[@]}"; do
            BODY=$(printf '{"event":"scheduledSync","client":"%s"}' "$CLIENT")
            SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SYNC_SECRET" | sed 's/^.* //')
            HTTP_STATUS=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
              https://clientes.vanzaklabs.com/clickup-webhook \
              -H 'Content-Type: application/json' \
              -H "X-Signature: $SIG" \
              -d "$BODY")
            echo "=== $CLIENT: HTTP $HTTP_STATUS ==="
            cat response.txt
            echo
            if [ "$HTTP_STATUS" -ge 400 ]; then
              FAILED=1
            fi
            # Espaça as chamadas pra não estourar o rate limit da API do ClickUp
            # (100 req/min) — clientes "projeto" fazem várias chamadas cada
            # (uma por item, pra buscar o comentário).
            sleep 5
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more client syncs failed"
            exit 1
          fi

      - name: Trigger team dashboard sync
        env:
          SYNC_SECRET: ${{ secrets.CLICKUP_WEBHOOK_SECRET }}
        run: |
          BODY='{"event":"scheduledSync","client":"team-dashboard"}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SYNC_SECRET" | sed 's/^.* //')
          HTTP_STATUS=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            https://clientes.vanzaklabs.com/team-dashboard-sync \
            -H 'Content-Type: application/json' \
            -H "X-Signature: $SIG" \
            -d "$BODY")
          echo "=== team-dashboard: HTTP $HTTP_STATUS ==="
          cat response.txt
          echo
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Team dashboard sync failed"
            exit 1
          fi
