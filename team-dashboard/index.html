<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Gestão — ClickUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@600&display=swap"
    />
    <style>
      :root {
        --bg: #f2f6fc;
        --panel: #ffffff;
        --ink: #0b1c33;
        --ink-soft: #5a6b85;
        --line: #dce5f0;
        --brand: #015ec5;
        --tint-1: #eaf1fc;
        --tint-2: #c7dcf5;
        --grey-bg: #edeff2;
        /* status (fixos — vêm da paleta de dataviz, nunca usados como cor de texto sozinhos) */
        --st-critical: #d03b3b;
        --st-critical-bg: #fbe7e6;
        --st-warning: #c98500;
        --st-warning-bg: #fdf1d9;
        --st-good: #0ca30c;
        --st-good-bg: #e3f6e3;
      }
      * {
        box-sizing: border-box;
      }
      html {
        overflow-x: hidden;
      }
      body {
        margin: 0;
        color: var(--ink);
        font-family: "Inter", sans-serif;
        font-weight: 500;
        padding: 0 0 90px;
        background: var(--bg);
        position: relative;
        overflow-x: hidden;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 88% -8%,
            rgba(1, 94, 197, 0.16),
            transparent 42%
          ),
          radial-gradient(
            circle at -6% 18%,
            rgba(1, 94, 197, 0.08),
            transparent 38%
          );
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(
          rgba(11, 28, 51, 0.07) 1px,
          transparent 1px
        );
        background-size: 22px 22px;
        pointer-events: none;
        z-index: 0;
        mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.9),
          rgba(0, 0, 0, 0.15) 60%,
          transparent 100%
        );
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 40px 24px 0;
        position: relative;
        z-index: 1;
      }
      .topbar {
        height: 5px;
        width: 100%;
        background: linear-gradient(
          90deg,
          var(--tint-1),
          var(--brand) 50%,
          var(--ink)
        );
        background-size: 200% 100%;
        animation: flow 7s ease-in-out infinite alternate;
        position: relative;
        z-index: 1;
      }
      @keyframes flow {
        0% {
          background-position: 0% 0;
        }
        100% {
          background-position: 100% 0;
        }
      }

      .head {
        margin-bottom: 28px;
        padding-bottom: 22px;
        border-bottom: 1px solid rgba(11, 28, 51, 0.14);
      }
      .logo {
        height: 34px;
      }
      .eyebrow {
        font-family: "Inter", sans-serif;
        font-size: 12px;
        color: var(--ink-soft);
        margin: 14px 0 6px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #2fbe6c;
        flex-shrink: 0;
        box-shadow: 0 0 0 0 rgba(47, 190, 108, 0.6);
        animation: pulse 1.8s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(47, 190, 108, 0.55);
        }
        70% {
          box-shadow: 0 0 0 7px rgba(47, 190, 108, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(47, 190, 108, 0);
        }
      }
      h1 {
        font-family: "Clash Grotesk", sans-serif;
        font-weight: 600;
        font-size: 32px;
        margin: 0;
        line-height: 1.1;
        color: var(--ink);
      }
      .head-meta {
        font-size: 12px;
        color: var(--ink-soft);
        margin-top: 8px;
      }

      .toolbar {
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .view-toggle {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        padding: 3px;
        gap: 2px;
      }
      .view-toggle button {
        border: none;
        background: transparent;
        color: var(--ink-soft);
        font-family: "Inter", sans-serif;
        font-size: 12.5px;
        font-weight: 500;
        padding: 7px 14px;
        border-radius: 7px;
        cursor: pointer;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }
      .view-toggle button.active {
        background: var(--brand);
        color: #fff;
      }
      .view-toggle button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .search-input {
        width: 100%;
        max-width: 340px;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font-family: "Inter", sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        outline: none;
        transition: border-color 0.15s ease;
      }
      .search-input:focus {
        border-color: var(--brand);
      }
      .search-input::placeholder {
        color: var(--ink-soft);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 14px;
        margin-bottom: 28px;
      }
      .stat-tile {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px;
        box-shadow: 0 1px 2px rgba(11, 28, 51, 0.04);
        position: relative;
        overflow: hidden;
      }
      .stat-tile::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: var(--accent, var(--brand));
      }
      .stat-label {
        font-size: 11.5px;
        color: var(--ink-soft);
        margin-bottom: 6px;
      }
      .stat-value {
        font-family: "Clash Grotesk", sans-serif;
        font-weight: 600;
        font-size: 26px;
        color: var(--ink);
        line-height: 1;
      }

      .block {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px 26px;
        margin-bottom: 22px;
        box-shadow: 0 1px 2px rgba(11, 28, 51, 0.04);
      }
      .block h2 {
        font-family: "Clash Grotesk", sans-serif;
        font-weight: 600;
        font-size: 17px;
        margin: 0 0 2px;
      }
      .block .sub {
        font-size: 12.5px;
        color: var(--ink-soft);
        margin-bottom: 16px;
      }

      /* --- cards por pessoa --- */
      .person-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px 26px;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(11, 28, 51, 0.04);
      }
      .person-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--brand);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        flex-shrink: 0;
        font-family: "Clash Grotesk", sans-serif;
      }
      .avatar.client {
        border-radius: 8px;
        background: var(--ink);
      }
      .person-name {
        font-family: "Clash Grotesk", sans-serif;
        font-weight: 600;
        font-size: 16px;
      }
      .person-chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-left: auto;
      }
      .chip {
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 20px;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .chip-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .chip.critical {
        background: var(--st-critical-bg);
        color: var(--st-critical);
      }
      .chip.critical .chip-dot {
        background: var(--st-critical);
      }
      .chip.warning {
        background: var(--st-warning-bg);
        color: var(--st-warning);
      }
      .chip.warning .chip-dot {
        background: var(--st-warning);
      }
      .chip.info {
        background: var(--tint-1);
        color: var(--brand);
      }
      .chip.info .chip-dot {
        background: var(--brand);
      }
      .chip.good {
        background: var(--st-good-bg);
        color: var(--st-good);
      }
      .chip.good .chip-dot {
        background: var(--st-good);
      }

      /* --- kanban (pessoa e cliente): grid de 3 colunas, o resto flui pra
         baixo em novas linhas — sem scroll horizontal. */
      .kanban-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        align-items: start;
      }
      @media (max-width: 900px) {
        .kanban-row {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .kanban-row {
          grid-template-columns: 1fr;
        }
      }
      .kanban-col .person-card {
        margin-bottom: 0;
      }

      /* Barra de acento no topo do card — sinaliza a urgência de relance,
         antes mesmo de ler os chips (vermelho=atrasada, âmbar=hoje,
         azul=em andamento, verde=em dia, cinza=parado). */
      .person-card {
        position: relative;
        overflow: hidden;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .person-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: var(--card-accent, var(--line));
      }
      .kanban-row .person-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(11, 28, 51, 0.09);
      }

      .trend-spark {
        display: block;
        flex-shrink: 0;
      }
      .kanban-spark {
        display: flex;
        justify-content: flex-end;
        margin: -6px 0 10px;
      }

      /* --- medidor de horas contratadas x usadas --- */
      .meter {
        margin-top: 4px;
      }
      .meter-track {
        height: 10px;
        border-radius: 5px;
        overflow: hidden;
        background: var(--grey-bg);
      }
      .meter-track.dashed {
        background: transparent;
        border: 1.5px dashed var(--line);
      }
      .meter-fill {
        height: 100%;
        border-radius: 5px;
        transition: width 0.4s ease;
      }
      .meter-caption {
        font-size: 12.5px;
        color: var(--ink);
        font-weight: 600;
        margin-top: 8px;
        font-variant-numeric: tabular-nums;
      }
      .meter-caption.muted {
        color: var(--ink-soft);
        font-weight: 500;
      }
      .meter-over {
        color: var(--st-critical);
        font-weight: 700;
      }
      .hours-history {
        font-size: 11.5px;
        color: var(--ink-soft);
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }

      .section {
        margin-top: 14px;
      }
      .section-title {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-bottom: 6px;
      }
      .section-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 280px;
        overflow-y: auto;
      }
      /* "Geral": lista única e mais longa (todas as entregas de projeto) —
         sem o teto de altura das colunas kanban, a página inteira rola. */
      .section-list.general-list {
        max-height: none;
        overflow-y: visible;
      }
      .task-row {
        display: block;
        padding: 7px 10px;
        border-radius: 8px;
        border-left: 3px solid var(--line);
        text-decoration: none;
        transition: background 0.12s ease;
      }
      .task-row:hover {
        background: var(--bg);
      }
      .task-row.critical {
        border-left-color: var(--st-critical);
      }
      .task-row.warning {
        border-left-color: #c98500;
      }
      .task-row.info {
        border-left-color: var(--brand);
      }
      .task-row.good {
        border-left-color: var(--st-good);
      }
      .task-row.neutral {
        border-left-color: var(--line);
      }
      .task-title {
        display: block;
        font-size: 13px;
        color: var(--ink);
      }
      .task-meta {
        display: block;
        font-size: 11px;
        color: var(--ink-soft);
        margin-top: 1px;
      }
      .task-client {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #fff;
        background: var(--brand);
        border-radius: 5px;
        padding: 2px 8px;
        margin-bottom: 4px;
      }
      .task-assignee {
        color: var(--ink);
        font-weight: 600;
      }
      .aging-critical {
        color: var(--st-critical);
        font-weight: 700;
      }
      .history-day {
        font-size: 11px;
        color: var(--ink-soft);
        font-weight: 600;
        margin: 10px 0 4px;
      }
      .history-day:first-child {
        margin-top: 0;
      }
      .approx-tag {
        opacity: 0.7;
      }

      details.section summary {
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        list-style: none;
      }
      details.section summary::-webkit-details-marker {
        display: none;
      }
      details.section summary::before {
        content: "▸ ";
      }
      details.section[open] summary::before {
        content: "▾ ";
      }
      details.section .section-list {
        margin-top: 8px;
      }

      .no-results {
        text-align: center;
        color: var(--ink-soft);
        font-size: 13.5px;
        padding: 30px 0;
      }
      .footnote {
        margin-top: 26px;
        font-size: 12px;
        color: var(--ink-soft);
        text-align: center;
      }

      @media (max-width: 640px) {
        .summary-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .person-chips {
          margin-left: 0;
          width: 100%;
        }
      }
    </style>
  </head>

        pendentes: "neutral",
        planejamento: "neutral",
      };

      let viewMode = "person";
      let scope = "recorrentes";

      // Recorrentes = espaço "Clientes Recorrentes" no ClickUp (CRO+CRM+
      // Planejamento, retainer mensal); Projetos = lista "Projetos" (Gestão
      // de Projetos, pontual). Cada task já carrega `list`, então o filtro
      // de escopo é só client-side, sem mudar o formato dos dados.
      const RECURRING_LISTS = new Set(["CRO", "CRM", "Planejamento"]);
      function inScope(t) {
        return scope === "recorrentes"
          ? RECURRING_LISTS.has(t.list)
          : t.list === "Projetos";
      }

      function personTaskBuckets(p) {
        return [
          p.today, p.overdue, p.upcoming, p.inProgress, p.backlog, p.doneRecent,
        ];
      }

      // Alguém que só trabalha em Recorrentes fica com todos os buckets
      // vazios quando o escopo é Projetos (e vice-versa) — isso NÃO é
      // "parado" (chip cinza, conta na tile de risco), é "não atua nesse
      // escopo". Checa a pessoa original (não filtrada) por qualquer sinal
      // no escopo antes de decidir se ela aparece no board.
      function hasScope(p) {
        return personTaskBuckets(p).some(bucket => bucket.some(inScope));
      }

      // Cópia rasa de uma pessoa com os 6 buckets filtrados pro escopo ativo
      // — personWorkload/chips/kanban continuam operando sem saber que
      // escopo existe. weeklyDone aponta pro array certo (dividido no
      // backend porque o ritmo de entrega não dá pra filtrar depois de
      // agregado por semana).
      function scopedPerson(p) {
        return {
          id: p.id,
          name: p.name,
          weeklyDone:
            scope === "recorrentes" ? p.weeklyDoneRecurring : p.weeklyDoneProjetos,
          today: p.today.filter(inScope),
          overdue: p.overdue.filter(inScope),
          upcoming: p.upcoming.filter(inScope),
          inProgress: p.inProgress.filter(inScope),
          backlog: p.backlog.filter(inScope),
          doneRecent: p.doneRecent.filter(inScope),
        };
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function fmtShort(date) {
        return date
          .toLocaleDateString("pt-BR", { day: "2-digit", month: "short" })
          .replace(".", "");
      }
      function fmtFull(date) {
        return date.toLocaleDateString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }
      function initials(name) {
        const parts = name.trim().split(/\s+/);
        const first = parts[0] ? parts[0].charAt(0) : "";
        const last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : "";
        return (first + last).toUpperCase();
      }

      function clientBadge(t) {
        if (!t.client) return "";
        return (
          '<span class="task-client">' + escapeHtml(t.client) + "</span>"
        );
      }

      // Sinaliza há quanto tempo uma tarefa atrasada está acumulando — uma
      // "atrasada" desde ontem e uma "atrasada" há 3 semanas hoje mostram o
      // mesmo chip vermelho; isso distingue as duas na própria linha.
      // Aging=7 dias ganha destaque em negrito, sinalizando risco maior.
      function agingLabel(t, accent) {
        if (accent !== "critical" || !t.dueMs) return "";
        const days = Math.max(1, Math.floor((Date.now() - t.dueMs) / 86400000));
        const text = "atrasada há " + days + (days === 1 ? " dia" : " dias");
        return days >= 7
          ? ' · <strong class="aging-critical">' + text + "</strong>"
          : " · " + text;
      }

      function taskRow(t, accent, opts) {
        opts = opts || {};
        const dateLabel = t.dueMs
          ? fmtShort(new Date(t.dueMs))
          : opts.noDateLabel || "sem prazo";
        const statusLabel =
          opts.showStatus === false ? "" : " · " + escapeHtml(t.status);
        const assigneeLabel = opts.assignee
          ? '<span class="task-assignee">' +
            escapeHtml(opts.assignee) +
            "</span> · "
          : "";
        return (
          '<a class="task-row ' +
          accent +
          '" href="' +
          escapeHtml(t.url) +
          '" target="_blank" rel="noopener">' +
          (opts.showClient === false ? "" : clientBadge(t)) +
          '<span class="task-title">' +
          escapeHtml(t.title) +
          "</span>" +
          '<span class="task-meta">' +
          assigneeLabel +
          escapeHtml(t.list) +
          " · " +
          dateLabel +
          statusLabel +
          agingLabel(t, accent) +
          "</span>" +
          "</a>"
        );
      }

      function section(title, html, collapsed) {
        if (!html) return "";
        if (collapsed) {
          return (
            '<details class="section"><summary>' +
            title +
            '</summary><div class="section-list">' +
            html +
            "</div></details>"
          );
        }
        return (
          '<div class="section"><div class="section-title">' +
          title +
          '</div><div class="section-list">' +
          html +
          "</div></div>"
        );
      }

      function renderHistory(doneRecent) {
        if (doneRecent.length === 0) return "";
        let html = "";
        let lastDay = null;
        doneRecent.forEach(function (t) {
          const day = fmtShort(new Date(t.closedMs));
          if (day !== lastDay) {
            html += '<div class="history-day">' + day + "</div>";
            lastDay = day;
          }
          const accent = STATUS_ACCENT[t.status] || "good";
          const label = t.approx
            ? ' <span class="approx-tag">(data aproximada, pelo prazo)</span>'
            : "";
          html +=
            '<a class="task-row ' +
            accent +
            '" href="' +
            escapeHtml(t.url) +
            '" target="_blank" rel="noopener">' +
            clientBadge(t) +
            '<span class="task-title">' +
            escapeHtml(t.title) +
            label +
            "</span>" +
            '<span class="task-meta">' +
            escapeHtml(t.list) +
            "</span>" +
            "</a>";
        });
        return html;
      }

      function personWorkload(p) {
        const todayIds = new Set(
          p.today.map(function (t) {
            return t.id;
          }),
        );
        const overdueIds = new Set(
          p.overdue.map(function (t) {
            return t.id;
          }),
        );
        const inProgressExtra = p.inProgress.filter(function (t) {
          return !todayIds.has(t.id) && !overdueIds.has(t.id);
        });
        return {
          overdueCount: p.overdue.length,
          todayCount: p.today.length,
          inProgressExtra: inProgressExtra,
          total: p.overdue.length + p.today.length + inProgressExtra.length,
        };
      }

      // Sem tarefa urgente e sem nada concluído nos últimos 14 dias — sinal
      // de que a fila pode não estar sendo alimentada, diferente de "fila
      // livre" (sem urgência, mas entregou algo recente).
      function isIdle(p, w) {
        return w.total === 0 && p.doneRecent.length === 0;
      }

      // Sparkline de ritmo de entrega: 8 semanas (weeklyDone[0] é a mais
      // recente — inverte pra desenhar mais antiga→mais recente, esquerda
      // pra direita). Série única: linha no tom de baixa ênfase, ponto mais
      // recente destacado na cor de marca (contrato de "trend" de stat-tile).
      function sparklineSvg(weeklyDone) {
        const data = weeklyDone || [];
        if (data.length === 0) return "";
        const series = data.slice().reverse();
        const w = 64,
          h = 20,
          pad = 2;
        const max = Math.max(1, ...series);
        const stepX =
          series.length > 1 ? (w - pad * 2) / (series.length - 1) : 0;
        const points = series.map(function (v, i) {
          return {
            x: pad + i * stepX,
            y: h - pad - (v / max) * (h - pad * 2),
          };
        });
        const pathD = points
          .map(function (pt, i) {
            return (i === 0 ? "M" : "L") + pt.x.toFixed(1) + "," + pt.y.toFixed(1);
          })
          .join(" ");
        const last = points[points.length - 1];
        const total = series.reduce(function (a, b) {
          return a + b;
        }, 0);
        return (
          '<svg class="trend-spark" width="' +
          w +
          '" height="' +
          h +
          '" viewBox="0 0 ' +
          w +
          " " +
          h +
          '" aria-hidden="true">' +
          "<title>Ritmo de entrega (8 semanas): " +
          total +
          " concluídas</title>" +
          '<path d="' +
          pathD +
          '" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>' +
          '<circle cx="' +
          last.x.toFixed(1) +
          '" cy="' +
          last.y.toFixed(1) +
          '" r="2.5" fill="var(--brand)" stroke="var(--panel)" stroke-width="1.5"/>' +
          "</svg>"
        );
      }

      // Pessoas do escopo ativo (ver hasScope), já com os 6 buckets filtrados
      // (scopedPerson) e o filtro de busca por nome aplicado — fonte comum
      // pro resumo do topo e pro board "Por pessoa".
      function visibleScopedPeople(filterText) {
        return teamData.people
          .filter(hasScope)
          .filter(function (p) {
            return !filterText || p.name.toLowerCase().indexOf(filterText) !== -1;
          })
          .map(scopedPerson);
      }

      function renderSummary() {
        let today = 0,
          overdue = 0,
          inProgress = 0,
          done = 0,
          idle = 0;
        visibleScopedPeople("").forEach(function (p) {
          today += p.today.length;
          overdue += p.overdue.length;
          inProgress += p.inProgress.length;
          done += p.doneRecent.length;
          if (isIdle(p, personWorkload(p))) idle++;
        });
        const tiles = [
          { label: "Tarefas hoje", value: today, accent: "#fab219" },
          { label: "Atrasadas", value: overdue, accent: "var(--st-critical)" },
          { label: "Em andamento", value: inProgress, accent: "var(--brand)" },
          {
            label: "Concluídas (14 dias)",
            value: done,
            accent: "var(--st-good)",
          },
          {
            label: "Pessoas paradas",
            value: idle,
            accent: idle > 0 ? "var(--st-warning)" : "var(--st-good)",
          },
        ];
        document.getElementById("summaryGrid").innerHTML = tiles
          .map(function (t) {
            return (
              '<div class="stat-tile" style="--accent:' +
              t.accent +
              ';">' +
              '<div class="stat-label">' +
              t.label +
              "</div>" +
              '<div class="stat-value">' +
              t.value +
              "</div>" +
              "</div>"
            );
          })
          .join("");
      }

      // Cor da barra de topo do card, do mais urgente pro menos: atrasada >
      // hoje > em andamento > (bom/parado conforme isEmptyGood).
      function urgencyAccent(criticalCount, warningCount, infoCount, isEmptyGood) {
        if (criticalCount) return "var(--st-critical)";
        if (warningCount) return "#fab219";
        if (infoCount) return "var(--brand)";
        return isEmptyGood ? "var(--st-good)" : "var(--ink-soft)";
      }

      function renderPersonKanban(filterText) {
        const people = visibleScopedPeople(filterText);

        document.getElementById("noResults").style.display =
          people.length === 0 ? "block" : "none";

        const cols = people
          .map(function (p) {
            const w = personWorkload(p);
            const chips = [];
            if (w.overdueCount)
              chips.push(
                '<span class="chip critical"><span class="chip-dot"></span>' +
                  w.overdueCount +
                  " atrasada" +
                  (w.overdueCount > 1 ? "s" : "") +
                  "</span>",
              );
            if (w.todayCount)
              chips.push(
                '<span class="chip warning"><span class="chip-dot"></span>' +
                  w.todayCount +
                  " hoje</span>",
              );
            if (p.inProgress.length)
              chips.push(
                '<span class="chip info"><span class="chip-dot"></span>' +
                  p.inProgress.length +
                  " em andamento</span>",
              );
            if (w.total === 0) {
              chips.push(
                isIdle(p, w)
                  ? '<span class="chip warning"><span class="chip-dot"></span>parado</span>'
                  : '<span class="chip good"><span class="chip-dot"></span>fila livre</span>',
              );
            }

            // Urgente = atrasadas + hoje + em andamento (sem prazo hoje), nessa
            // ordem — cada fonte já vem ordenada por prazo pelo backend.
            const urgentHtml =
              p.overdue
                .map(function (t) {
                  return taskRow(t, "critical");
                })
                .join("") +
              p.today
                .map(function (t) {
                  return taskRow(t, "warning");
                })
                .join("") +
              w.inProgressExtra
                .map(function (t) {
                  return taskRow(t, "info");
                })
                .join("");
            const upcomingHtml = p.upcoming
              .map(function (t) {
                return taskRow(t, "neutral");
              })
              .join("");
            const backlogHtml = p.backlog
              .map(function (t) {
                return taskRow(t, "neutral", { showStatus: false });
              })
              .join("");
            const historyHtml = renderHistory(p.doneRecent);
            const accent = urgencyAccent(
              w.overdueCount,
              w.todayCount,
              w.inProgressExtra.length,
              !isIdle(p, w),
            );

            return (
              '<div class="kanban-col">' +
              '<div class="person-card" style="--card-accent:' +
              accent +
              ';">' +
              '<div class="person-head">' +
              '<span class="avatar">' +
              initials(p.name) +
              "</span>" +
              '<span class="person-name">' +
              escapeHtml(p.name) +
              "</span>" +
              '<div class="person-chips">' +
              chips.join("") +
              "</div>" +
              "</div>" +
              '<div class="kanban-spark">' +
              sparklineSvg(p.weeklyDone) +
              "</div>" +
              section("Urgente", urgentHtml) +
              section("Próximas", upcomingHtml, true) +
              section("Feito recentemente", historyHtml, true) +
              section(
                "Sem prazo definido (" + p.backlog.length + ")",
                backlogHtml,
                true,
              ) +
              "</div>" +
              "</div>"
            );
          })
          .join("");

        document.getElementById("peopleGrid").innerHTML =
          '<div class="kanban-row">' + cols + "</div>";
      }

      // Achata as tarefas em aberto de todo mundo (sem "Feito recentemente" —
      // essa visão é sobre o que falta, não histórico), marcando cada uma com
      // quem é responsável, e agrupa por cliente.
      function flattenClientTasks(filterText) {
        const items = [];
        teamData.people
          .filter(function (p) {
            return (
              !filterText || p.name.toLowerCase().indexOf(filterText) !== -1
            );
          })
          .forEach(function (p) {
            const buckets = [
              { list: p.overdue, accent: "critical" },
              { list: p.today, accent: "warning" },
              { list: p.inProgress, accent: "info" },
              { list: p.upcoming, accent: "neutral" },
              { list: p.backlog, accent: "neutral" },
            ];
            buckets.forEach(function (b) {
              b.list.filter(inScope).forEach(function (t) {
                items.push({ task: t, accent: b.accent, assignee: p.name });
              });
            });
          });
        return items;
      }

      function groupByClient(items) {
        const map = new Map();
        items.forEach(function (item) {
          const key = item.task.client || "Sem cliente";
          if (!map.has(key)) map.set(key, []);
          map.get(key).push(item);
        });
        return map;
      }

      const ACCENT_RANK = { critical: 0, warning: 1, info: 2, neutral: 3 };

      function renderClientBoard(filterText) {
        const items = flattenClientTasks(filterText);
        const groups = groupByClient(items);

        document.getElementById("noResults").style.display =
          groups.size === 0 ? "block" : "none";

        const urgentCount = function (list) {
          return list.filter(function (i) {
            return i.accent === "critical" || i.accent === "warning";
          }).length;
        };

        const clients = [...groups.keys()].sort(function (a, b) {
          const diff = urgentCount(groups.get(b)) - urgentCount(groups.get(a));
          return diff !== 0 ? diff : a.localeCompare(b);
        });

        const cols = clients
          .map(function (client) {
            const list = groups.get(client).slice().sort(function (x, y) {
              const rankDiff = ACCENT_RANK[x.accent] - ACCENT_RANK[y.accent];
              if (rankDiff !== 0) return rankDiff;
              return (x.task.dueMs || Infinity) - (y.task.dueMs || Infinity);
            });
            const criticalCount = list.filter(function (i) {
              return i.accent === "critical";
            }).length;
            const warningCount = list.filter(function (i) {
              return i.accent === "warning";
            }).length;
            const infoCount = list.filter(function (i) {
              return i.accent === "info";
            }).length;

            const chips = [];
            if (criticalCount)
              chips.push(
                '<span class="chip critical"><span class="chip-dot"></span>' +
                  criticalCount +
                  " atrasada" +
                  (criticalCount > 1 ? "s" : "") +
                  "</span>",
              );
            if (warningCount)
              chips.push(
                '<span class="chip warning"><span class="chip-dot"></span>' +
                  warningCount +
                  " hoje</span>",
              );
            if (infoCount)
              chips.push(
                '<span class="chip info"><span class="chip-dot"></span>' +
                  infoCount +
                  " em andamento</span>",
              );
            if (!chips.length)
              chips.push(
                '<span class="chip good"><span class="chip-dot"></span>em dia</span>',
              );

            const rowsHtml = list
              .map(function (i) {
                return taskRow(i.task, i.accent, {
                  assignee: i.assignee,
                  showClient: false,
                });
              })
              .join("");
            const accent = urgencyAccent(criticalCount, warningCount, infoCount, true);

            return (
              '<div class="kanban-col">' +
              '<div class="person-card" style="--card-accent:' +
              accent +
              ';">' +
              '<div class="person-head">' +
              '<span class="avatar client">' +
              initials(client) +
              "</span>" +
              '<span class="person-name">' +
              escapeHtml(client) +
              "</span>" +
              '<div class="person-chips">' +
              chips.join("") +
              "</div>" +
              "</div>" +
              '<div class="section-list">' +
              rowsHtml +
              "</div>" +
              "</div>" +
              "</div>"
            );
          })
          .join("");

        document.getElementById("peopleGrid").innerHTML =
          '<div class="kanban-row">' + cols + "</div>";
      }

      const MONTH_ABBR = [
        "Jan", "Fev", "Mar", "Abr", "Mai", "Jun",
        "Jul", "Ago", "Set", "Out", "Nov", "Dez",
      ];
      function monthShortLabel(key) {
        const parts = key.split("-");
        const idx = Number(parts[1]) - 1;
        return MONTH_ABBR[idx] || key;
      }

      // Severidade do mês atual — mesma cor alimenta a barra de acento do
      // card (--card-accent) e o preenchimento do medidor, pra ficarem
      // coerentes de relance. contractedHours == null é "sem sinal" (cinza,
      // mesma convenção do urgencyAccent pra pessoa parada) — nunca tratado
      // como 0 contratado.
      function hoursSeverity(contractedHours, usedHours) {
        if (contractedHours == null) {
          return { pct: 0, fill: "var(--ink-soft)", track: "var(--grey-bg)", over: false };
        }
        const rawPct = contractedHours > 0 ? (usedHours / contractedHours) * 100 : (usedHours > 0 ? 101 : 0);
        if (rawPct > 100) return { pct: 100, fill: "var(--st-critical)", track: "var(--st-critical-bg)", over: true };
        if (rawPct >= 80) return { pct: rawPct, fill: "var(--st-warning)", track: "var(--st-warning-bg)", over: false };
        return { pct: rawPct, fill: "var(--st-good)", track: "var(--st-good-bg)", over: false };
      }

      function fmtHours(h) {
        return (Math.round(h * 10) / 10).toString().replace(/\.0$/, "");
      }

      function renderMeter(contractedHours, usedHours) {
        const sev = hoursSeverity(contractedHours, usedHours);
        if (contractedHours == null) {
          return (
            '<div class="meter">' +
            '<div class="meter-track dashed"></div>' +
            '<div class="meter-caption muted">Horas contratadas não configuradas</div>' +
            "</div>"
          );
        }
        const overLabel = sev.over
          ? ' <span class="meter-over">+' + fmtHours(usedHours - contractedHours) + "h</span>"
          : "";
        return (
          '<div class="meter">' +
          '<div class="meter-track" style="background:' +
          sev.track +
          ';">' +
          '<div class="meter-fill" style="width:' +
          sev.pct.toFixed(1) +
          "%;background:" +
          sev.fill +
          ';"></div>' +
          "</div>" +
          '<div class="meter-caption">' +
          fmtHours(usedHours) +
          "h / " +
          fmtHours(contractedHours) +
          "h" +
          overLabel +
          "</div>" +
          "</div>"
        );
      }

      // teamData.recurringHours[].months vem do backend com o mês mais
      // recente primeiro (índice 0 = mês atual, ainda em andamento) —
      // ver lastNMonthKeys em team-dashboard-sync.js.
      function renderHoursBoard(filterText) {
        const entries = (teamData.recurringHours || []).filter(function (e) {
          return !filterText || e.client.toLowerCase().indexOf(filterText) !== -1;
        });

        document.getElementById("noResults").style.display =
          entries.length === 0 ? "block" : "none";

        const cols = entries
          .map(function (e) {
            const current = e.months[0];
            const history = e.months.slice(1);
            const historyHtml = history.length
              ? '<div class="hours-history">' +
                history
                  .map(function (m) {
                    return monthShortLabel(m.key) + ": " + fmtHours(m.usedHours) + "h";
                  })
                  .join(" · ") +
                "</div>"
              : "";
            const sev = hoursSeverity(e.contractedHours, current.usedHours);

            return (
              '<div class="kanban-col">' +
              '<div class="person-card" style="--card-accent:' +
              sev.fill +
              ';">' +
              '<div class="person-head">' +
              '<span class="avatar client">' +
              initials(e.client) +
              "</span>" +
              '<span class="person-name">' +
              escapeHtml(e.client) +
              "</span>" +
              '<div class="person-chips">' +
              '<span class="chip info"><span class="chip-dot"></span>' +
              e.service +
              "</span>" +
              "</div>" +
              "</div>" +
              renderMeter(e.contractedHours, current.usedHours) +
              historyHtml +
              "</div>" +
              "</div>"
            );
          })
          .join("");

        document.getElementById("peopleGrid").innerHTML =
          '<div class="kanban-row">' + cols + "</div>";
      }

      // Uma linha por cliente-projeto (task-mãe "CLIENTES" na lista Projetos
      // — ver buildClientProjectTimelines em team-dashboard-sync.js), com o
      // início e o prazo do projeto inteiro (Kick-off/Go-Live), ordenada por
      // prazo (sem prazo vai pro fim). Diferente de "Por cliente" (demandas
      // individuais agrupadas por cliente), aqui é o timeline macro.
      function projectAccent(dueMs) {
        if (dueMs == null) return "neutral";
        if (dueMs < Date.now()) return "critical";
        if (dueMs < Date.now() + 86400000) return "warning";
        return "good";
      }

      function clientProjectRow(p) {
        const accent = projectAccent(p.dueMs);
        const startLabel = p.startMs
          ? "início " + fmtShort(new Date(p.startMs)) + " · "
          : "";
        const dueLabel = p.dueMs
          ? "prazo " + fmtShort(new Date(p.dueMs))
          : "sem prazo";
        return (
          '<a class="task-row ' +
          accent +
          '" href="' +
          escapeHtml(p.url) +
          '" target="_blank" rel="noopener">' +
          '<span class="task-title">' +
          escapeHtml(p.client) +
          "</span>" +
          '<span class="task-meta">' +
          startLabel +
          dueLabel +
          agingLabel({ dueMs: p.dueMs }, accent) +
          "</span>" +
          "</a>"
        );
      }

      function renderGeneralView(filterText) {
        const entries = (teamData.clientProjects || [])
          .filter(function (p) {
            return !filterText || p.client.toLowerCase().indexOf(filterText) !== -1;
          })
          .slice()
          .sort(function (a, b) {
            return (a.dueMs || Infinity) - (b.dueMs || Infinity);
          });

        document.getElementById("noResults").style.display =
          entries.length === 0 ? "block" : "none";

        const rowsHtml = entries.map(clientProjectRow).join("");

        document.getElementById("peopleGrid").innerHTML =
          '<div class="person-card"><div class="section-list general-list">' +
          rowsHtml +
          "</div></div>";
      }

      function renderAll(filterText) {
        if (viewMode === "hours") renderHoursBoard(filterText);
        else if (viewMode === "client") renderClientBoard(filterText);
        else if (viewMode === "general") renderGeneralView(filterText);
        else renderPersonKanban(filterText);
      }

      function currentFilterText() {
        return document.getElementById("searchInput").value.trim().toLowerCase();
      }

      document.getElementById("generatedAt").textContent = teamData.generatedAt
        ? "Atualizado em " + fmtFull(new Date(teamData.generatedAt))
        : "Ainda não sincronizado";

      renderSummary();
      renderAll("");

      document
        .getElementById("searchInput")
        .addEventListener("input", function (e) {
          renderAll(e.target.value.trim().toLowerCase());
        });

      function setViewMode(mode) {
        // "Horas" só existe em escopo Recorrentes, "Geral" só em Projetos —
        // nunca deixa ficar preso numa aba que saiu de escopo (ver setScope).
        if (mode === "hours" && scope !== "recorrentes") mode = "person";
        if (mode === "general" && scope !== "projetos") mode = "person";
        viewMode = mode;
        document
          .getElementById("viewPersonBtn")
          .classList.toggle("active", mode === "person");
        document
          .getElementById("viewClientBtn")
          .classList.toggle("active", mode === "client");
        document
          .getElementById("viewHoursBtn")
          .classList.toggle("active", mode === "hours");
        document
          .getElementById("viewGeneralBtn")
          .classList.toggle("active", mode === "general");
        renderAll(currentFilterText());
      }
      document
        .getElementById("viewPersonBtn")
        .addEventListener("click", function () {
          setViewMode("person");
        });
      document
        .getElementById("viewClientBtn")
        .addEventListener("click", function () {
          setViewMode("client");
        });
      document
        .getElementById("viewHoursBtn")
        .addEventListener("click", function () {
          setViewMode("hours");
        });
      document
        .getElementById("viewGeneralBtn")
        .addEventListener("click", function () {
          setViewMode("general");
        });

      function setScope(mode) {
        scope = mode;
        document
          .getElementById("scopeRecorrentesBtn")
          .classList.toggle("active", mode === "recorrentes");
        document
          .getElementById("scopeProjetosBtn")
          .classList.toggle("active", mode === "projetos");
        document.getElementById("viewHoursBtn").disabled = mode !== "recorrentes";
        document.getElementById("viewGeneralBtn").disabled = mode !== "projetos";
        // Sai da aba Horas/Geral automaticamente se ela deixou de fazer
        // sentido — setViewMode já faz esse rebaixamento, só precisa ser
        // chamado com o viewMode atual pra reavaliar.
        setViewMode(viewMode);
        renderSummary();
      }
      document
        .getElementById("scopeRecorrentesBtn")
        .addEventListener("click", function () {
          setScope("recorrentes");
        });
      document
        .getElementById("scopeProjetosBtn")
        .addEventListener("click", function () {
          setScope("projetos");
        });
    </script>
  </body>
</html>
